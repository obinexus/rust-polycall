[package]
name = "rust-polycall"
version = "1.5.0"
edition = "2021"
description = "Rust adapter for libpolycall (thin FFI over the shared core)"
license = "MIT"
authors = ["Nnamdi Michael Okpala <okpalan@protonmail.com>"]
homepage = "https://www.libpolycall.obinexus.org"
repository = "https://github.com/obinexus/libpolycall"

[lib]
name = "rust_polycall"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

build = "build.rs"

# The build script compiles the shared C core from source with the SAME
# toolchain Rust uses (MSVC or GNU), so the crate is self-contained and links
# cleanly on every platform. See build.rs.
[build-dependencies]
cc = "1"
