[package]
name = "rust-polycall"
version = "1.5.0"
edition = "2021"
rust-version = "1.70"
description = "Thin, safe Rust adapter for the libpolycall FFI"
license = "MIT"
authors = ["Nnamdi Michael Okpala <okpalan@protonmail.com>"]
readme = "README.md"
homepage = "https://www.libpolycall.obinexus.org"
repository = "https://github.com/obinexus/rust-polycall"
keywords = ["libpolycall", "ffi", "adapter"]
categories = ["api-bindings"]
build = "build.rs"

[lib]
name = "rust_polycall"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[package.metadata.libpolycall]
minimum-version = "1.5.0"
library-environment = "POLYCALL_LIB_DIR"
